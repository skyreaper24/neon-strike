<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#04080f"/>
  <title>Neon Strike — by Shaurya</title>
  <meta name="description" content="Neon Strike: A fast-paced 2D neon arcade shooter. Survive waves of enemies, collect power-ups, and climb the leaderboard. Made by Shaurya."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cyan:#00f0ff;--pink:#ff2d7b;--gold:#ffd93d;--purple:#b537f2;--green:#39ff14;--bg:#04080f}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e0eaf4;font-family:'Rajdhani',sans-serif;touch-action:none;overscroll-behavior:none}
    body{display:flex;align-items:center;justify-content:center}
    #wrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#030810}
    canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
    #hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(6px,env(safe-area-inset-top,4px)) max(8px,env(safe-area-inset-right,4px)) 0 max(8px,env(safe-area-inset-left,4px));z-index:4;pointer-events:none}
    #hud-top>*{pointer-events:auto}
    h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(12px,2.5vw,22px);background:linear-gradient(90deg,#00f0ff,#ffd93d,#ff2d7b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.12em;filter:drop-shadow(0 0 8px rgba(0,240,255,.4))}
    .hud-stats{font-family:'Orbitron',sans-serif;font-size:clamp(9px,1.4vw,12px);display:flex;gap:clamp(6px,1.5vw,14px);align-items:center;flex-wrap:wrap}
    .hv{font-weight:700}.hs{color:var(--gold)}.hh{color:var(--pink)}.hw{color:var(--cyan)}.hc{color:var(--green)}.hb{color:var(--gold)}
    .hud-r{display:flex;gap:5px;align-items:center}
    .cb{background:rgba(8,16,32,.65);border:1px solid #1a3a5a;border-radius:6px;color:#8ab4d8;padding:3px 7px;cursor:pointer;font-size:clamp(14px,2.2vw,17px);line-height:1;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .15s}
    .cb:active{border-color:var(--cyan);color:var(--cyan)}
    #pu-bar{position:absolute;bottom:max(6px,env(safe-area-inset-bottom,4px));left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:4;pointer-events:none}
    .pui{width:clamp(20px,3.5vw,26px);height:clamp(20px,3.5vw,26px);border-radius:5px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.8vw,13px);background:rgba(6,13,24,.6);opacity:.2;transition:all .2s;backdrop-filter:blur(2px)}
    .pui.on{opacity:1;box-shadow:0 0 8px currentColor;border-color:currentColor}
    #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .35s;padding:clamp(12px,3vw,24px);overflow-y:auto}
    #ov.off{opacity:0;pointer-events:none}
    .ov-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-1}
    .ov-bg::after{content:'';position:absolute;inset:0;background:rgba(3,8,16,.55)}
    .mb{font-family:'Orbitron',sans-serif;font-size:clamp(13px,2.8vw,18px);color:#00f0ff;letter-spacing:.1em;cursor:pointer;background:rgba(0,240,255,.06);border:1.5px solid rgba(0,240,255,.3);padding:clamp(10px,2.5vw,14px) clamp(24px,6vw,44px);border-radius:10px;transition:all .2s;animation:bl 1.3s step-end infinite;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    .mb:hover,.mb:active{background:rgba(0,240,255,.14);border-color:#00f0ff;box-shadow:0 0 28px rgba(0,240,255,.25);transform:scale(1.04)}
    @keyframes bl{50%{opacity:.25}}
    .mc{margin-top:clamp(14px,3vw,22px);font-size:clamp(10px,1.5vw,12px);color:rgba(180,200,220,.7);line-height:2;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.8)}
    .mc kbd{display:inline-block;border:1px solid rgba(60,100,140,.5);border-radius:4px;padding:1px 5px;color:#a0c0e0;font-family:'Orbitron',sans-serif;font-size:.85em;background:rgba(15,30,55,.5)}
    .cd,.cm{display:none}
    .cw{margin-top:clamp(12px,3vw,18px);padding-top:10px;border-top:1px solid rgba(30,60,90,.5);text-align:center}
    .cw .au{color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(11px,1.8vw,14px);text-shadow:0 0 12px rgba(255,217,61,.4)}
    .cw p{font-size:clamp(9px,1.3vw,11px);color:rgba(80,110,140,.8);line-height:1.8}
    .gt{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(22px,6vw,48px);color:#ff2d7b;text-shadow:0 0 30px rgba(255,45,123,.5);margin-bottom:8px;text-align:center}
    .gs{font-size:clamp(11px,1.8vw,14px);color:rgba(140,170,200,.85);line-height:2.1;margin-bottom:18px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.8)}
    .gs span{color:#ffd93d;font-weight:700;font-family:'Orbitron',sans-serif}
    .gs .nb{color:#39ff14!important;font-size:1.1em}
    .logo-img{max-width:min(85vw,600px);height:auto;margin-bottom:clamp(8px,2vw,20px);filter:drop-shadow(0 0 30px rgba(0,240,255,.3))}
    #flash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .06s}
    /* Loading screen */
    #loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#030810;z-index:20;transition:opacity .5s}
    #loader.done{opacity:0;pointer-events:none}
    .load-text{font-family:'Orbitron',sans-serif;font-size:14px;color:#5a7a96;letter-spacing:.2em;margin-top:16px}
    .load-bar{width:200px;height:3px;background:rgba(20,40,70,.5);border-radius:2px;overflow:hidden;margin-top:8px}
    .load-fill{height:100%;background:linear-gradient(90deg,#00f0ff,#ffd93d);width:0%;transition:width .2s}
    @media(max-width:600px){.hud-stats .lbl{display:none}}
    @media(max-height:420px){h1{font-size:12px}}
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="hud-top">
    <h1>NEON STRIKE</h1>
    <div class="hud-stats">
      <span class="hs hv" id="hs">0000</span>
      <span class="hh" id="hh">♥♥♥♥♥</span>
      <span class="hw" id="hwv">W1</span>
      <span class="hc" id="hcv">x1</span>
      <span class="hb" id="hbv">💣3</span>
    </div>
    <div class="hud-r">
      <button class="cb" id="vb" title="Sound">🔊</button>
      <button class="cb" id="fb" title="Fullscreen">⛶</button>
    </div>
  </div>
  <div id="pu-bar">
    <div class="pui" id="pr" style="color:var(--gold)">⚡</div>
    <div class="pui" id="ps" style="color:var(--cyan)">✦</div>
    <div class="pui" id="ph" style="color:var(--purple)">🛡</div>
    <div class="pui" id="pm" style="color:var(--green)">🧲</div>
  </div>
  <div id="ov"><div class="ov-bg" id="ov-bg"></div></div>
  <div id="loader">
    <div class="load-text">LOADING ASSETS</div>
    <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
  </div>
</div>

<script>
(()=>{
'use strict';

// ═══════════════════════════════════════
//  ASSET LOADER
// ═══════════════════════════════════════
const ASSETS={
  menu_bg:'assets/menu_bg.jpg', gameover_bg:'assets/gameover_bg.jpg', logo:'assets/logo.jpg',
  player:'assets/player_ship.jpg', explosion:'assets/explosion.jpg',
  e_swarm:'assets/enemy_swarm.jpg', e_runner:'assets/enemy_runner.jpg',
  e_tank:'assets/enemy_tank.jpg', e_splitter:'assets/enemy_splitter.jpg', e_ghost:'assets/enemy_ghost.jpg'
};
const img={};
let loaded=0, totalAssets=Object.keys(ASSETS).length;

function loadAll(){
  return new Promise(res=>{
    for(const[k,src]of Object.entries(ASSETS)){
      const i=new Image();
      i.onload=()=>{loaded++;document.getElementById('load-fill').style.width=(loaded/totalAssets*100)+'%';if(loaded>=totalAssets){setTimeout(()=>{document.getElementById('loader').classList.add('done');res()},300)}};
      i.onerror=()=>{loaded++;document.getElementById('load-fill').style.width=(loaded/totalAssets*100)+'%';if(loaded>=totalAssets){setTimeout(()=>{document.getElementById('loader').classList.add('done');res()},300)}};
      i.src=src;
      img[k]=i;
    }
  });
}

// ═══════════════════════════════════════
//  DEVICE
// ═══════════════════════════════════════
const isMob=('ontouchstart' in window&&navigator.maxTouchPoints>0&&matchMedia('(hover:none)').matches)||/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const isLow=isMob&&(navigator.hardwareConcurrency||4)<=4;
document.querySelectorAll('.cd').forEach(e=>e.style.display=isMob?'none':'block');
document.querySelectorAll('.cm').forEach(e=>e.style.display=isMob?'block':'none');

// ═══════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════
const AC=window.AudioContext||window.webkitAudioContext;
let ax=null,mg=null,muted=false,mus=null;
function ia(){if(!ax){ax=new AC();mg=ax.createGain();mg.gain.value=.3;mg.connect(ax.destination)}if(ax.state==='suspended')ax.resume()}
function pt(f,t,d,v=.2,det=0){if(!ax)return;const o=ax.createOscillator(),g=ax.createGain();o.type=t;o.frequency.value=f;o.detune.value=det;g.gain.setValueAtTime(v,ax.currentTime);g.gain.exponentialRampToValueAtTime(.001,ax.currentTime+d);o.connect(g);g.connect(mg);o.start();o.stop(ax.currentTime+d)}
function pn(d,v=.1){if(!ax)return;const n=ax.sampleRate*d,b=ax.createBuffer(1,n,ax.sampleRate),dat=b.getChannelData(0);for(let i=0;i<n;i++)dat[i]=Math.random()*2-1;const s=ax.createBufferSource();s.buffer=b;const g=ax.createGain();g.gain.setValueAtTime(v,ax.currentTime);g.gain.exponentialRampToValueAtTime(.001,ax.currentTime+d);const fl=ax.createBiquadFilter();fl.type='highpass';fl.frequency.value=800;s.connect(fl);fl.connect(g);g.connect(mg);s.start()}
const snd={
  shoot(){pt(920,'square',.055,.09);pt(1300,'sawtooth',.04,.04)},
  hit(){pt(100,'sine',.25,.2);pn(.18,.17)},
  kill(){pn(.1,.12);pt(340,'sawtooth',.08,.07)},
  dash(){pt(220,'sine',.12,.12);pt(650,'sine',.08,.05,120)},
  bomb(){pt(50,'sine',.65,.28);pn(.45,.24);pt(35,'triangle',.75,.16)},
  pu(){pt(523,'sine',.07,.1);setTimeout(()=>pt(659,'sine',.07,.1),50);setTimeout(()=>pt(784,'sine',.11,.1),100)},
  wave(){pt(440,'triangle',.11,.08);setTimeout(()=>pt(660,'triangle',.14,.08),90)},
  go(){pt(440,'sawtooth',.26,.1);setTimeout(()=>pt(330,'sawtooth',.26,.1),170);setTimeout(()=>pt(220,'sawtooth',.4,.1),340)},
  heal(){pt(660,'sine',.07,.08);setTimeout(()=>pt(880,'sine',.1,.08),65)},
  combo(){pt(1047,'sine',.05,.05)}
};
function startMus(){if(!ax||mus)return;const o=ax.createOscillator(),g=ax.createGain(),f=ax.createBiquadFilter();o.type='sine';o.frequency.value=55;g.gain.value=.03;f.type='lowpass';f.frequency.value=100;o.connect(f);f.connect(g);g.connect(mg);o.start();mus={o,g}}
function stopMus(){if(mus){try{mus.o.stop()}catch(e){}mus=null}}
document.getElementById('vb').onclick=()=>{muted=!muted;if(mg)mg.gain.value=muted?0:.3;document.getElementById('vb').textContent=muted?'🔇':'🔊';haptic('tap')};

// ═══════════════════════════════════════
//  HAPTICS — visual + vibration
// ═══════════════════════════════════════
const canVib=!!navigator.vibrate;
const flashEl=document.getElementById('flash');
let camZoom=0,camZoomV=0,chromaShift=0,shakeX=0,shakeY=0,shakePow=0,hudPulse=0;

function vib(p){if(canVib)navigator.vibrate(p)}
function haptic(type){
  switch(type){
    case'shoot':vib(6);shakePow=Math.max(shakePow,1.5);break;
    case'dash':vib([12,8,20]);camZoomV+=.025;shakePow=Math.max(shakePow,5);screenFlash('rgba(0,240,255,0.12)',120);break;
    case'hit':vib([50,25,70,25,50]);camZoomV+=.04;shakePow=Math.max(shakePow,18);chromaShift=Math.max(chromaShift,6);screenFlash('rgba(255,30,60,0.25)',200);hudPulse=1;break;
    case'kill':vib([10,6,15]);shakePow=Math.max(shakePow,3);camZoomV+=.008;break;
    case'bomb':vib([35,15,70,25,110,35,70]);camZoomV+=.07;shakePow=Math.max(shakePow,28);chromaShift=Math.max(chromaShift,12);screenFlash('rgba(255,255,255,0.35)',300);hudPulse=1;break;
    case'powerup':vib([8,12,8,12,8]);screenFlash('rgba(0,240,255,0.08)',150);camZoomV+=.012;break;
    case'combo':vib([8,8,8,8,15]);screenFlash('rgba(57,255,20,0.1)',120);break;
    case'wave':vib([18,30,18]);screenFlash('rgba(0,240,255,0.06)',250);break;
    case'gameover':vib([90,50,90,50,180]);chromaShift=Math.max(chromaShift,15);shakePow=Math.max(shakePow,20);screenFlash('rgba(255,30,60,0.3)',500);break;
    case'shield':vib([20,12,35]);screenFlash('rgba(181,55,242,0.15)',180);shakePow=Math.max(shakePow,8);break;
    case'heal':vib([6,15,6]);screenFlash('rgba(255,45,123,0.08)',150);break;
    case'tap':vib(4);break;
  }
}
let flashTimer=0,flashDur=0;
function screenFlash(color,durMs){flashEl.style.background=color;flashEl.style.opacity='1';flashTimer=durMs;flashDur=durMs}
function updateFlash(dt){if(flashTimer>0){flashTimer-=dt*1000;flashEl.style.opacity=String(Math.max(0,flashTimer/flashDur))}}

// ═══════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════
const c=document.getElementById('game'),X=c.getContext('2d');
let W,H,GW=960,GH=540;
function resize(){const r=c.parentElement.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,isLow?2:3);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);W=c.width;H=c.height;const a=W/H;if(a>16/9)GW=GH*(W/H);else GH=GW/(W/H)}
resize();addEventListener('resize',resize);
screen.orientation?.addEventListener?.('change',()=>setTimeout(resize,200));
function gx(v){return v/GW*W}function gy(v){return v/GH*H}function gs(v){return v/GW*W}
document.getElementById('fb').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});haptic('tap')};

// ═══════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════
const stars=[];for(let i=0;i<100;i++)stars.push({x:Math.random()*960,y:Math.random()*540,s:Math.random()*1.6+.3,b:Math.random()*.4+.15,sp:Math.random()*2+.5});

// ═══════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════
const keys={},mouse={x:GW/2,y:GH/2,down:false};
let joyAct=false,joyO=null,joyV={x:0,y:0};
let aimAct=false,tIds={m:-1,a:-1},wDash=false,wBomb=false;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(st==='menu'&&(e.key==='Enter'||e.key===' '))go();if(st==='gameover'&&(e.key==='Enter'||e.key.toLowerCase()==='r'))go();if(e.key.toLowerCase()==='r'&&st==='playing')go();if(e.key.toLowerCase()==='p'&&st==='playing')pau=!pau});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*GW;mouse.y=(e.clientY-r.top)/r.height*GH});
c.addEventListener('mousedown',()=>{mouse.down=true;if(st==='menu')go()});
addEventListener('mouseup',()=>mouse.down=false);

function tg(t){const r=c.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width*GW,y:(t.clientY-r.top)/r.height*GH}}
c.addEventListener('touchstart',e=>{e.preventDefault();if(st==='menu'){go();return}if(st==='gameover'){go();return}for(const t of e.changedTouches){const pos=tg(t);if(mbtn.dash&&Math.hypot(pos.x-mbtn.dash.x,pos.y-mbtn.dash.y)<mbtn.dash.r){wDash=true;continue}if(mbtn.bomb&&Math.hypot(pos.x-mbtn.bomb.x,pos.y-mbtn.bomb.y)<mbtn.bomb.r){wBomb=true;continue}if(pos.x<GW*.5){tIds.m=t.identifier;joyAct=true;joyO={x:pos.x,y:pos.y};joyV={x:0,y:0}}else{tIds.a=t.identifier;aimAct=true;mouse.x=pos.x;mouse.y=pos.y;mouse.down=true}}},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const pos=tg(t);if(t.identifier===tIds.m&&joyO){const dx=pos.x-joyO.x,dy=pos.y-joyO.y,d=Math.hypot(dx,dy),mx=40,cl=Math.min(d,mx);joyV=d>2?{x:dx/d*(cl/mx),y:dy/d*(cl/mx)}:{x:0,y:0};if(d>mx*2.5&&p&&p.dashCd<=0)wDash=true}if(t.identifier===tIds.a){mouse.x=pos.x;mouse.y=pos.y}}},{passive:false});
c.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===tIds.m){tIds.m=-1;joyAct=false;joyO=null;joyV={x:0,y:0}}if(t.identifier===tIds.a){tIds.a=-1;aimAct=false;mouse.down=false}}},{passive:false});
c.addEventListener('touchcancel',e=>{for(const t of e.changedTouches){if(t.identifier===tIds.m){tIds.m=-1;joyAct=false;joyO=null;joyV={x:0,y:0}}if(t.identifier===tIds.a){tIds.a=-1;aimAct=false;mouse.down=false}}},{passive:false});
document.addEventListener('touchmove',e=>{if(st==='playing')e.preventDefault()},{passive:false});

function gpad(){const gps=navigator.getGamepads?.();if(!gps)return;for(const gp of gps){if(!gp)continue;const dz=.15;const lx=Math.abs(gp.axes[0])>dz?gp.axes[0]:0,ly=Math.abs(gp.axes[1])>dz?gp.axes[1]:0;if(Math.hypot(lx,ly)>dz)joyV={x:lx,y:ly};const rx=Math.abs(gp.axes[2])>dz?gp.axes[2]:0,ry=Math.abs(gp.axes[3])>dz?gp.axes[3]:0;if(Math.hypot(rx,ry)>dz&&p){mouse.x=p.x+rx*200;mouse.y=p.y+ry*200;mouse.down=true}if(gp.buttons[0]?.pressed)mouse.down=true;if(gp.buttons[1]?.pressed)wDash=true;if(gp.buttons[2]?.pressed)wBomb=true;if(gp.buttons[9]?.pressed&&st!=='playing')go();if(gp.vibrationActuator&&shakePow>5){try{gp.vibrationActuator.playEffect('dual-rumble',{duration:60,strongMagnitude:Math.min(1,shakePow/25),weakMagnitude:Math.min(1,shakePow/15)})}catch(e){}}break}}

// ═══════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════
let st='menu',pau=false;const ov=document.getElementById('ov');
let p,shots,foes,sparks,pups,popups,trails,bTrails,explosions;
let score,time,wave,waveT,waveTxt,waveTxtT,combo,comboT,maxCombo,kills,fired,bombs,lastShot;
let hi=parseInt(localStorage.getItem('ns_hi')||'0');
let pu={rapid:0,spread:0,shield:0,magnet:0};
const rnd=(a,b)=>Math.random()*(b-a)+a;

const ET={
  swarm:{r:11,hp:1,sp:85,col:'#ff2d7b',sc:10,img:'e_swarm',glow:'rgba(255,45,123,'},
  runner:{r:9,hp:1,sp:180,col:'#00f0ff',sc:15,img:'e_runner',glow:'rgba(0,240,255,'},
  tank:{r:24,hp:5,sp:46,col:'#b537f2',sc:40,img:'e_tank',glow:'rgba(181,55,242,'},
  splitter:{r:15,hp:2,sp:68,col:'#ffd93d',sc:25,img:'e_splitter',glow:'rgba(255,217,61,'},
  ghost:{r:13,hp:2,sp:105,col:'#39ff14',sc:30,img:'e_ghost',glow:'rgba(57,255,20,'}
};
const PT=[{t:'rapid',i:'⚡',c:'#ffd93d',d:8},{t:'spread',i:'✦',c:'#00f0ff',d:7},{t:'shield',i:'🛡',c:'#b537f2',d:6},{t:'magnet',i:'🧲',c:'#39ff14',d:10},{t:'heal',i:'♥',c:'#ff2d7b',d:0},{t:'bomb',i:'💣',c:'#ff8c00',d:0}];

function reset(){
  p={x:GW/2,y:GH/2,vx:0,vy:0,hp:5,mhp:5,dash:0,dashCd:0,inv:0,ang:0};
  shots=[];foes=[];sparks=[];pups=[];popups=[];trails=[];bTrails=[];explosions=[];
  score=0;time=0;wave=0;waveT=2;waveTxt='';waveTxtT=0;
  combo=0;comboT=0;maxCombo=0;kills=0;fired=0;bombs=3;lastShot=0;
  shakePow=0;camZoom=0;camZoomV=0;chromaShift=0;
  pu={rapid:0,spread:0,shield:0,magnet:0};mouse.x=GW/2;mouse.y=GH/2;
}
function go(){ia();resize();reset();st='playing';pau=false;ov.classList.add('off');startMus();nw();snd.wave();haptic('wave')}
document.getElementById('sb')?.addEventListener?.('click',go);

function over(){st='gameover';stopMus();snd.go();haptic('gameover');if(score>hi){hi=score;localStorage.setItem('ns_hi',String(hi))}showGO()}
function showGO(){
  const n=score>=hi&&score>0;
  ov.innerHTML=`<div class="ov-bg" style="background-image:url(assets/gameover_bg.jpg)"></div>
    <div class="gt">SYSTEM DOWN</div><div class="gs">
    Final Score: <span>${score}</span><br>Best: <span class="${n?'nb':''}">${hi} ${n?'★ NEW!':''}</span><br>
    Wave: <span>${wave}</span> · Kills: <span>${kills}</span><br>
    Max Combo: <span>x${maxCombo}</span> · Accuracy: <span>${fired?Math.round(kills/fired*100):0}%</span></div>
    <button class="mb" id="rp">► PLAY AGAIN</button>
    <div class="cw"><p class="au">Made by Shaurya</p><p>A neon-soaked arcade shooter · 2026</p></div>`;
  document.getElementById('rp').onclick=()=>{ov.classList.add('off');go()};
  ov.classList.remove('off');
}

let wq=[],spT=0;
function nw(){
  wave++;waveTxt=`WAVE ${wave}`;waveTxtT=2.5;spT=1;snd.wave();haptic('wave');wq=[];const b=5+wave*3;
  for(let i=0;i<b;i++){
    if(wave<3)wq.push('swarm');
    else if(wave<5)wq.push(Math.random()<.7?'swarm':'runner');
    else if(wave<8){const r=Math.random();wq.push(r<.4?'swarm':r<.63?'runner':r<.8?'tank':'splitter')}
    else{const r=Math.random();wq.push(r<.27?'swarm':r<.47?'runner':r<.62?'tank':r<.77?'splitter':'ghost')}
  }
}
function spawn(type){
  const e=ET[type],edge=Math.random()*4|0;let ex,ey;
  if(edge===0){ex=rnd(0,GW);ey=-30}else if(edge===1){ex=GW+30;ey=rnd(0,GH)}
  else if(edge===2){ex=rnd(0,GW);ey=GH+30}else{ex=-30;ey=rnd(0,GH)}
  foes.push({x:ex,y:ey,r:e.r,hp:e.hp,mhp:e.hp,s:e.sp+wave*2.5,col:e.col,sc:e.sc,img:e.img,glow:e.glow,type,ph:rnd(0,6.28),ft:0,rot:rnd(0,6.28)});
}

// ═══════════════════════════════════════

function burst(px,py,n,col,sp=180){n=isLow?Math.round(n*.5):n;for(let i=0;i<n&&sparks.length<(isLow?80:250);i++){const a=rnd(0,Math.PI*2),s=rnd(25,sp);sparks.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.2,.7),ml:.7,col,sz:rnd(1.5,4.5)})}}
function popup(px,py,txt,col){popups.push({x:px,y:py,text:txt,col,life:1.3,scale:1.5})}
function trail(px,py,col,sz=3){if(trails.length<(isLow?25:70))trails.push({x:px,y:py,life:.35,col,sz})}
function addExplosion(px,py,scale=1){explosions.push({x:px,y:py,life:.5,ml:.5,scale})}

function useBomb(){if(bombs<=0)return;bombs--;snd.bomb();haptic('bomb');for(const f of foes){score+=f.sc*Math.max(1,combo);kills++;addExplosion(f.x,f.y,.8);popup(f.x,f.y,`+${f.sc}`,f.col)}foes=[];burst(p.x,p.y,40,'#ffffff',380);burst(p.x,p.y,25,'#00f0ff',320);addExplosion(p.x,p.y,2);p.inv=1.5}
function spawnPU(px,py){if(Math.random()>.25)return;const t=PT[Math.floor(Math.random()*PT.length)];pups.push({x:px,y:py,t:t.t,i:t.i,c:t.c,d:t.d,life:8,ph:rnd(0,6.28)})}
function nearest(){let best=null,bd=Infinity;for(const f of foes){const d=Math.hypot(f.x-p.x,f.y-p.y);if(d<bd){bd=d;best=f}}return best}

function update(dt){
  if(pau)return;
  time+=dt;updateFlash(dt);waveTxtT=Math.max(0,waveTxtT-dt);comboT-=dt;if(comboT<=0)combo=0;
  for(const k in pu)pu[k]=Math.max(0,pu[k]-dt);
  camZoom+=camZoomV;camZoomV*=.85;camZoom*=.9;chromaShift*=.88;if(chromaShift<.3)chromaShift=0;
  shakePow*=.88;if(shakePow<.2)shakePow=0;shakeX=rnd(-shakePow,shakePow);shakeY=rnd(-shakePow,shakePow);hudPulse*=.9;

  document.getElementById('pr').classList.toggle('on',pu.rapid>0);
  document.getElementById('ps').classList.toggle('on',pu.spread>0);
  document.getElementById('ph').classList.toggle('on',pu.shield>0);
  document.getElementById('pm').classList.toggle('on',pu.magnet>0);
  const hudEl=document.getElementById('hud-top');
  hudEl.style.transform=hudPulse>.1?`scale(${1+hudPulse*.06})`:'';

  gpad();p.dash=Math.max(0,p.dash-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.inv=Math.max(0,p.inv-dt);
  let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyV.x;
  let ay=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyV.y;
  const il=Math.hypot(ax,ay);if(il>1){ax/=il;ay/=il}
  const sp=p.dash>0?780:270;p.vx+=(ax*sp-p.vx)*Math.min(1,dt*12);p.vy+=(ay*sp-p.vy)*Math.min(1,dt*12);

  if(isMob&&!aimAct){const ne=nearest();if(ne)p.ang=Math.atan2(ne.y-p.y,ne.x-p.x);else p.ang=Math.atan2(mouse.y-p.y,mouse.x-p.x)}
  else p.ang=Math.atan2(mouse.y-p.y,mouse.x-p.x);

  if((keys[' ']||wDash)&&p.dashCd<=0){p.dash=.15;p.dashCd=.75;p.inv=.25;keys[' ']=false;wDash=false;snd.dash();haptic('dash');burst(p.x,p.y,18,'#00f0ff',190)}
  wDash=false;if(keys['e']||wBomb){keys['e']=false;wBomb=false;useBomb()}
  p.x=Math.max(18,Math.min(GW-18,p.x+p.vx*dt));p.y=Math.max(18,Math.min(GH-18,p.y+p.vy*dt));
  if(Math.hypot(p.vx,p.vy)>25)trail(p.x-Math.cos(p.ang)*14,p.y-Math.sin(p.ang)*14,p.dash>0?'#00f0ff':'#0a2a4a',p.dash>0?4:2.5);

  const fr=pu.rapid>0?.055:.125;const shoot=mouse.down||(isMob&&!aimAct&&foes.length>0&&joyAct);
  if(shoot&&time-lastShot>fr){lastShot=time;fired++;snd.shoot();haptic('shoot');
    if(pu.spread>0){for(let i=-2;i<=2;i++){const a=p.ang+i*.12;shots.push({x:p.x+Math.cos(a)*18,y:p.y+Math.sin(a)*18,vx:Math.cos(a)*720,vy:Math.sin(a)*720,life:.8})}}
    else{shots.push({x:p.x+Math.cos(p.ang)*18,y:p.y+Math.sin(p.ang)*18,vx:Math.cos(p.ang)*720,vy:Math.sin(p.ang)*720,life:.8});
      if(pu.rapid>0){const a2=p.ang+rnd(-.06,.06);shots.push({x:p.x+Math.cos(a2)*18,y:p.y+Math.sin(a2)*18,vx:Math.cos(a2)*720,vy:Math.sin(a2)*720,life:.8})}}}

  shots.forEach(q=>{if(bTrails.length<(isLow?30:120))bTrails.push({x:q.x,y:q.y,life:.1});q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt});
  shots=shots.filter(q=>q.life>0&&q.x>-30&&q.x<GW+30&&q.y>-30&&q.y<GH+30);

  if(wq.length>0){spT-=dt;if(spT<=0){spT=Math.max(.12,.55-wave*.025);spawn(wq.pop())}}
  if(wq.length===0&&foes.length===0){waveT-=dt;if(waveT<=0){waveT=2.5;nw();if(wave%3===1&&wave>1)bombs=Math.min(bombs+1,5)}}

  foes.forEach(f=>{const a=Math.atan2(p.y-f.y,p.x-f.x);let mx=Math.cos(a)*f.s*dt,my=Math.sin(a)*f.s*dt;if(f.type==='ghost'){f.ph+=dt*3;mx+=Math.cos(f.ph)*38*dt;my+=Math.sin(f.ph)*38*dt}f.x+=mx;f.y+=my;f.ft=Math.max(0,f.ft-dt);f.rot+=dt*1.5;if(pu.magnet>0){const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<180){f.x-=Math.cos(a)*75*dt;f.y-=Math.sin(a)*75*dt}}});

  for(const q of shots){for(const f of foes){if(f.dead)continue;if(Math.hypot(q.x-f.x,q.y-f.y)<f.r+4){q.life=0;f.hp--;f.ft=.09;burst(q.x,q.y,3,'#ffd93d',110);if(f.hp<=0){f.dead=true;kills++;combo++;comboT=2;if(combo>maxCombo)maxCombo=combo;const pts=f.sc*Math.max(1,combo);score+=pts;snd.kill();haptic('kill');
    if(combo>0&&combo%5===0){snd.combo();haptic('combo')}
    addExplosion(f.x,f.y,f.type==='tank'?1.2:.7);burst(f.x,f.y,14,f.col,210);popup(f.x,f.y,`+${pts}`,combo>=5?'#39ff14':'#ffd93d');if(combo>=10)popup(f.x,f.y-18,`x${combo} COMBO!`,'#39ff14');
    if(f.type==='splitter'){for(let i=0;i<2;i++)foes.push({x:f.x+rnd(-18,18),y:f.y+rnd(-18,18),r:7,hp:1,mhp:1,s:85+wave*2,col:'#ffa040',sc:5,img:'e_swarm',glow:'rgba(255,160,64,',type:'swarm',ph:0,ft:0,rot:rnd(0,6.28)})}
    spawnPU(f.x,f.y)}break}}}
  foes=foes.filter(f=>!f.dead);

  for(const f of foes){if(Math.hypot(p.x-f.x,p.y-f.y)<f.r+12&&p.inv<=0){
    if(pu.shield>0){pu.shield=0;f.dead=true;burst(f.x,f.y,16,'#b537f2',190);snd.kill();haptic('shield');popup(p.x,p.y-18,'SHIELD!','#b537f2')}
    else{p.hp--;p.inv=1.2;snd.hit();haptic('hit');burst(p.x,p.y,25,'#ff2d7b',240);if(p.hp<=0){over();return}}}}

  pups.forEach(u=>{u.life-=dt;u.ph+=dt*4;if(pu.magnet>0){const dx=p.x-u.x,dy=p.y-u.y,d=Math.hypot(dx,dy);if(d<220&&d>3){u.x+=dx/d*190*dt;u.y+=dy/d*190*dt}}
    if(Math.hypot(p.x-u.x,p.y-u.y)<28){u.life=0;snd.pu();haptic('powerup');burst(u.x,u.y,8,u.c,140);
      if(u.t==='heal'){p.hp=Math.min(p.hp+1,p.mhp);snd.heal();haptic('heal');popup(u.x,u.y,'+1 HP','#ff2d7b')}
      else if(u.t==='bomb'){bombs=Math.min(bombs+1,5);popup(u.x,u.y,'+BOMB','#ff8c00')}
      else{pu[u.t]=u.d;popup(u.x,u.y,u.t.toUpperCase()+'!',u.c)}}});
  pups=pups.filter(u=>u.life>0);

  sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.91;s.vy*=.91;s.life-=dt});sparks=sparks.filter(s=>s.life>0);
  trails.forEach(t=>t.life-=dt);trails=trails.filter(t=>t.life>0);
  bTrails.forEach(b=>b.life-=dt);bTrails=bTrails.filter(b=>b.life>0);
  explosions.forEach(e=>e.life-=dt);explosions=explosions.filter(e=>e.life>0);
  popups.forEach(pp=>{pp.life-=dt;pp.y-=35*dt;pp.scale+=(1-pp.scale)*.12});popups=popups.filter(pp=>pp.life>0);

  document.getElementById('hs').textContent=String(score).padStart(4,'0');
  document.getElementById('hh').textContent='♥'.repeat(p.hp)+'♡'.repeat(p.mhp-p.hp);
  document.getElementById('hwv').textContent='W'+wave;
  const ce=document.getElementById('hcv');ce.textContent=combo>1?`x${combo}`:'x1';
  ce.style.color=combo>=10?'#ff2d7b':combo>=5?'#ffd93d':'#39ff14';
  document.getElementById('hbv').textContent='💣'+bombs;
}

// ═══════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════
const mbtn={dash:null,bomb:null};

function draw(){
  X.save();
  X.translate(W/2,H/2);X.scale(1+camZoom,1+camZoom);X.translate(-W/2+gx(shakeX),-H/2+gy(shakeY));

  // Background gradient
  const bg=X.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0a1020');bg.addColorStop(.5,'#060c18');bg.addColorStop(1,'#020508');
  X.fillStyle=bg;X.fillRect(0,0,W,H);

  // Stars
  for(const s of stars){X.globalAlpha=Math.max(0,s.b+Math.sin(time*s.sp+s.x)*.12);X.fillStyle='#b0c8e0';X.beginPath();X.arc(gx(s.x),gy(s.y),gs(s.s),0,7);X.fill();if(s.s>1.2&&!isLow){X.globalAlpha*=.15;X.beginPath();X.arc(gx(s.x),gy(s.y),gs(s.s*3),0,7);X.fill()}}X.globalAlpha=1;

  // Grid
  if(!isLow){const ga=.035+Math.sin(time*1.2)*.01;X.strokeStyle=`rgba(20,60,100,${ga})`;X.lineWidth=Math.max(1,gs(.7));const gsp=gs(48);for(let i=0;i<W;i+=gsp){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(let i=0;i<H;i+=gsp){X.beginPath();X.moveTo(0,i);X.lineTo(W,i);X.stroke()}}

  // Vignette
  const vg=X.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.9);vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,2,6,0.55)');X.fillStyle=vg;X.fillRect(0,0,W,H);

  // Trails
  for(const t of trails){X.globalAlpha=t.life*2.5;X.fillStyle=t.col;X.beginPath();X.arc(gx(t.x),gy(t.y),gs(t.sz),0,7);X.fill()}X.globalAlpha=1;

  // Bullet trails
  for(const b of bTrails){X.globalAlpha=b.life/.1*.15;X.fillStyle='#ffeea0';X.beginPath();X.arc(gx(b.x),gy(b.y),gs(2),0,7);X.fill()}X.globalAlpha=1;

  // Particles
  for(const s of sparks){const a=Math.max(0,s.life/s.ml);X.globalAlpha=a;const sz=gs(s.sz)*a;const gr=X.createRadialGradient(gx(s.x),gy(s.y),0,gx(s.x),gy(s.y),sz*1.5);gr.addColorStop(0,'#fff');gr.addColorStop(.3,s.col);gr.addColorStop(1,'transparent');X.fillStyle=gr;X.beginPath();X.arc(gx(s.x),gy(s.y),sz*1.5,0,7);X.fill()}X.globalAlpha=1;

  // Explosion sprites
  for(const e of explosions){
    if(!img.explosion?.complete)continue;
    const progress=1-e.life/e.ml;
    const sz=gs(60*e.scale*(1+progress*.5));
    X.globalAlpha=Math.max(0,e.life/e.ml);
    X.save();X.translate(gx(e.x),gy(e.y));X.rotate(progress*2);
    X.globalCompositeOperation='screen';
    X.drawImage(img.explosion,-sz,-sz,sz*2,sz*2);
    X.globalCompositeOperation='source-over';
    X.restore();
  }
  X.globalAlpha=1;

  // Power-ups
  for(const u of pups){X.save();const ux=gx(u.x),uy=gy(u.y)+Math.sin(u.ph)*gs(4);const rg=X.createRadialGradient(ux,uy,gs(4),ux,uy,gs(20));rg.addColorStop(0,u.c+'40');rg.addColorStop(1,'transparent');X.fillStyle=rg;X.beginPath();X.arc(ux,uy,gs(20),0,7);X.fill();X.strokeStyle=u.c;X.lineWidth=gs(1.5);X.globalAlpha=.5+Math.sin(u.ph*2)*.3;X.beginPath();X.arc(ux,uy,gs(13),0,Math.PI*2);X.stroke();X.globalAlpha=1;X.fillStyle=u.c;X.font=`${Math.round(gs(13))}px sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(u.i,ux,uy+gs(1));X.restore()}

  // Enemies — SPRITE BASED
  for(const f of foes){
    X.save();
    const fx=gx(f.x),fy=gy(f.y),fr=gs(f.r);
    // Glow halo
    const eg=X.createRadialGradient(fx,fy,fr*.2,fx,fy,fr*2.5);
    eg.addColorStop(0,f.glow+'0.18)');eg.addColorStop(.5,f.glow+'0.04)');eg.addColorStop(1,'transparent');
    X.fillStyle=eg;X.beginPath();X.arc(fx,fy,fr*2.5,0,7);X.fill();
    // Sprite
    const sprImg=img[f.img];
    if(sprImg?.complete){
      const sz=fr*2.6;
      X.save();X.translate(fx,fy);X.rotate(f.rot);
      if(f.ft>0){X.globalCompositeOperation='source-over';X.globalAlpha=.7;X.drawImage(sprImg,-sz,-sz,sz*2,sz*2);X.globalCompositeOperation='screen';X.globalAlpha=.5;X.drawImage(sprImg,-sz,-sz,sz*2,sz*2);X.globalCompositeOperation='source-over';X.globalAlpha=1}
      else{X.drawImage(sprImg,-sz,-sz,sz*2,sz*2)}
      X.restore();
    }else{
      // Fallback circle
      X.fillStyle=f.ft>0?'#fff':f.col;X.beginPath();X.arc(fx,fy,fr,0,7);X.fill();
    }
    // Ghost aura
    if(f.type==='ghost'){X.globalAlpha=.2+Math.sin(time*5+f.ph)*.12;X.strokeStyle=f.col;X.lineWidth=gs(1.5);X.setLineDash([gs(4),gs(4)]);X.beginPath();X.arc(fx,fy,fr*1.5,0,7);X.stroke();X.setLineDash([]);X.globalAlpha=1}
    // HP bar
    if(f.mhp>1&&f.hp<f.mhp){const bw=fr*2;X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(fx-bw/2,fy-fr-gs(8),bw,gs(3));X.fillStyle=f.col;X.fillRect(fx-bw/2,fy-fr-gs(8),bw*(f.hp/f.mhp),gs(3))}
    X.restore();
  }

  // Bullets
  for(const q of shots){const qx=gx(q.x),qy=gy(q.y),qr=gs(4);const qg=X.createRadialGradient(qx,qy,0,qx,qy,qr*3);qg.addColorStop(0,'rgba(255,248,200,0.6)');qg.addColorStop(.4,'rgba(255,217,61,0.2)');qg.addColorStop(1,'transparent');X.fillStyle=qg;X.beginPath();X.arc(qx,qy,qr*3,0,7);X.fill();X.fillStyle='#fffae0';X.beginPath();X.arc(qx,qy,qr,0,7);X.fill()}

  // Player — SPRITE BASED
  if(st!=='gameover'||Math.floor(time*8)%2){
    X.save();X.translate(gx(p.x),gy(p.y));X.rotate(p.ang);
    const ps=gs(1);
    // Shield
    if(pu.shield>0){const sg=X.createRadialGradient(0,0,18*ps,0,0,26*ps);sg.addColorStop(0,'transparent');sg.addColorStop(.5,`rgba(181,55,242,${.18+Math.sin(time*6)*.1})`);sg.addColorStop(1,'transparent');X.fillStyle=sg;X.beginPath();X.arc(0,0,26*ps,0,7);X.fill();X.strokeStyle=`rgba(181,55,242,${.35+Math.sin(time*6)*.18})`;X.lineWidth=2*ps;X.beginPath();X.arc(0,0,24*ps,0,Math.PI*2);X.stroke()}
    // Sprite
    const shipImg=img.player;
    if(shipImg?.complete){
      const sz=gs(28);
      X.globalAlpha=p.inv>0&&Math.floor(time*14)%2?.4:1;
      X.drawImage(shipImg,-sz,-sz*.9,sz*2,sz*1.8);
      X.globalAlpha=1;
    }else{
      // Fallback triangle
      X.fillStyle=p.inv>0&&Math.floor(time*15)%2?'#fff':'#00f0ff';
      X.beginPath();X.moveTo(24*ps,0);X.lineTo(-14*ps,13*ps);X.lineTo(-8*ps,0);X.lineTo(-14*ps,-13*ps);X.closePath();X.fill();
    }
    X.restore();
    // Player glow
    if(!isLow){const pg=X.createRadialGradient(gx(p.x),gy(p.y),0,gx(p.x),gy(p.y),gs(32));pg.addColorStop(0,'rgba(0,240,255,0.05)');pg.addColorStop(1,'transparent');X.fillStyle=pg;X.beginPath();X.arc(gx(p.x),gy(p.y),gs(32),0,7);X.fill()}
  }

  // Dash CD
  if(p.dashCd>0){X.strokeStyle='rgba(0,240,255,0.18)';X.lineWidth=gs(2);X.beginPath();X.arc(gx(p.x),gy(p.y),gs(28),-Math.PI/2,-Math.PI/2+Math.PI*2*(1-p.dashCd/.75));X.stroke()}

  // Popups
  for(const pp of popups){X.globalAlpha=Math.max(0,Math.min(1,pp.life));X.fillStyle=pp.col;X.font=`bold ${Math.round((pp.text.length>8?11:13)*gs(1)*pp.scale)}px 'Orbitron',sans-serif`;X.textAlign='center';X.fillText(pp.text,gx(pp.x),gy(pp.y))}X.globalAlpha=1;

  // Wave text
  if(waveTxtT>0){X.save();X.globalAlpha=Math.min(1,waveTxtT);X.textAlign='center';const wg2=X.createRadialGradient(W/2,H/2,0,W/2,H/2,gs(200));wg2.addColorStop(0,'rgba(0,240,255,0.04)');wg2.addColorStop(1,'transparent');X.fillStyle=wg2;X.fillRect(0,0,W,H);X.fillStyle='#00f0ff';X.font=`900 ${Math.round((40+(2.5-waveTxtT)*3)*gs(1))}px 'Orbitron',sans-serif`;X.fillText(waveTxt,W/2,H/2-gs(15));X.fillStyle='#6a8aa8';X.font=`600 ${Math.round(13*gs(1))}px 'Orbitron',sans-serif`;X.fillText('GET READY',W/2,H/2+gs(18));X.restore()}

  // Mobile controls
  if(isMob&&st==='playing'){
    if(joyAct&&joyO){const jr=gs(45),ox=gx(joyO.x),oy=gy(joyO.y);X.strokeStyle='rgba(0,240,255,0.12)';X.lineWidth=gs(1.5);X.beginPath();X.arc(ox,oy,jr,0,Math.PI*2);X.stroke();const kx=ox+joyV.x*jr,ky=oy+joyV.y*jr;const kg=X.createRadialGradient(kx,ky,0,kx,ky,gs(16));kg.addColorStop(0,'rgba(0,240,255,0.2)');kg.addColorStop(1,'rgba(0,240,255,0.04)');X.fillStyle=kg;X.beginPath();X.arc(kx,ky,gs(16),0,7);X.fill();X.strokeStyle='rgba(0,240,255,0.3)';X.lineWidth=gs(1.2);X.stroke()}
    const br=gs(20);const dx=gx(GW-38),dy=gy(GH-90),bx=gx(GW-38),by=gy(GH-45);
    X.strokeStyle=p.dashCd>0?'rgba(0,240,255,0.08)':'rgba(0,240,255,0.25)';X.fillStyle=p.dashCd>0?'rgba(0,240,255,0.02)':'rgba(0,240,255,0.06)';X.lineWidth=gs(1.5);X.beginPath();X.arc(dx,dy,br,0,Math.PI*2);X.fill();X.stroke();X.fillStyle=p.dashCd>0?'rgba(0,240,255,0.2)':'#00f0ff';X.font=`bold ${Math.round(gs(8))}px 'Orbitron',sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText('DASH',dx,dy);
    X.strokeStyle=bombs<=0?'rgba(255,45,123,0.08)':'rgba(255,45,123,0.25)';X.fillStyle=bombs<=0?'rgba(255,45,123,0.02)':'rgba(255,45,123,0.06)';X.beginPath();X.arc(bx,by,br,0,Math.PI*2);X.fill();X.stroke();X.fillStyle=bombs<=0?'rgba(255,45,123,0.2)':'#ff2d7b';X.fillText('BOMB',bx,by);
    mbtn.dash={x:GW-38,y:GH-90,r:25};mbtn.bomb={x:GW-38,y:GH-45,r:25};
  }

  // Chromatic aberration
  if(chromaShift>1&&!isLow){X.globalCompositeOperation='screen';X.globalAlpha=.1;X.drawImage(c,-gs(chromaShift),0);X.drawImage(c,gs(chromaShift),0);X.globalCompositeOperation='source-over';X.globalAlpha=1}

  // Pause
  if(pau){X.fillStyle='rgba(3,8,16,0.7)';X.fillRect(0,0,W,H);X.textAlign='center';X.fillStyle='#00f0ff';X.font=`900 ${Math.round(gs(36))}px 'Orbitron',sans-serif`;X.fillText('PAUSED',W/2,H/2);X.fillStyle='#5a7a96';X.font=`${Math.round(gs(11))}px 'Orbitron',sans-serif`;X.fillText(isMob?'Tap to resume':'Press P to resume',W/2,H/2+gs(26))}

  // Scanlines
  if(!isLow){X.globalAlpha=.02;X.fillStyle='#000';for(let i=0;i<H;i+=4)X.fillRect(0,i,W,2);X.globalAlpha=1}

  X.restore();
}

// ═══════════════════════════════════════
//  MENU
// ═══════════════════════════════════════
function showMenu(){
  ov.innerHTML=`<div class="ov-bg" style="background-image:url(assets/menu_bg.jpg)"></div>
    <img src="assets/logo.jpg" class="logo-img" alt="Neon Strike">
    <button class="mb" id="sb">► START GAME</button>
    <div class="mc">
      <div class="cd"><kbd>WASD</kbd>/<kbd>↑↓←→</kbd> move · <kbd>Mouse</kbd> aim · <kbd>Click</kbd> shoot<br><kbd>Space</kbd> dash · <kbd>E</kbd> bomb · <kbd>R</kbd> restart · <kbd>P</kbd> pause · 🎮 Gamepad</div>
      <div class="cm">Left thumb: move · Right thumb: aim+shoot<br>DASH &amp; BOMB buttons on screen</div>
    </div>
    <div class="cw"><p class="au">Made by Shaurya</p><p>A neon-soaked arcade shooter · 2026</p></div>`;
  document.querySelectorAll('.cd').forEach(e=>e.style.display=isMob?'none':'block');
  document.querySelectorAll('.cm').forEach(e=>e.style.display=isMob?'block':'none');
  document.getElementById('sb').onclick=go;
  ov.classList.remove('off');
}

function menuBg(){
  if(st!=='menu')return;
  const t=performance.now()/1000;
  // Draw menu background image
  if(img.menu_bg?.complete){X.drawImage(img.menu_bg,0,0,W,H);X.fillStyle='rgba(3,8,16,0.4)';X.fillRect(0,0,W,H)}
  else{const bg2=X.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);bg2.addColorStop(0,'#0a1020');bg2.addColorStop(1,'#020508');X.fillStyle=bg2;X.fillRect(0,0,W,H)}
  // Floating particles
  for(let i=0;i<20;i++){const px=(.5+Math.sin(t*.25+i*2.1)*.5)*W,py=(.5+Math.cos(t*.18+i*1.7)*.5)*H;X.globalAlpha=.08+Math.sin(t+i)*.05;X.fillStyle=['#00f0ff','#ff2d7b','#ffd93d'][i%3];X.beginPath();X.arc(px,py,gs(1.5+Math.sin(t*2+i)),0,7);X.fill()}
  X.globalAlpha=1;
  requestAnimationFrame(menuBg);
}

// ═══════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════
let last=0;
function loop(t){const dt=Math.min(.033,(t-last||0)/1000);last=t;if(st==='playing')update(dt);if(st==='playing'||st==='gameover')draw();requestAnimationFrame(loop)}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
async function init(){
  await loadAll();
  reset();resize();showMenu();menuBg();requestAnimationFrame(loop);
}
init();

})();
</script>
