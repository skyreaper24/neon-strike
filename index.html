<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Strike</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070b16; color:#e8f6ff; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; overflow:hidden; }
    #shell { width:min(960px, 100vw); padding:16px; }
    header { display:flex; justify-content:space-between; align-items:center; margin:0 0 10px; letter-spacing:.08em; font-size:13px; color:#88a9c9; }
    h1 { margin:0; color:#ffdc63; font-size:clamp(20px,4vw,34px); text-shadow:0 0 18px #e68b28; }
    canvas { width:100%; aspect-ratio:16/9; display:block; border:1px solid #28527a; border-radius:12px; background:#090f1d; box-shadow:0 0 50px #0f426c66; touch-action:none; }
    #help { margin:10px 2px 0; color:#9bb3c9; font-size:12px; line-height:1.5; }
    kbd { border:1px solid #52718d; border-radius:4px; padding:1px 5px; color:#fff; }
  </style>
</head>
<body>
  <main id="shell">
    <header><h1>NEON STRIKE</h1><div id="hud">SCORE 0000 · HP ♥♥♥</div></header>
    <canvas id="game" width="960" height="540" aria-label="Neon Strike 2D action game"></canvas>
    <p id="help"><kbd>WASD</kbd> move · <kbd>Mouse</kbd> aim · <kbd>Click</kbd> shoot · <kbd>Space</kbd> dash · survive the swarm</p>
  </main>
<script>
(() => {
  const c = document.querySelector('#game'), x = c.getContext('2d'), hud = document.querySelector('#hud');
  const W=c.width,H=c.height, keys={}, mouse={x:W/2,y:H/2,down:false};
  let p, shots, foes, sparks, score, time, over, last, spawn, shake;
  const rnd=(a,b)=>Math.random()*(b-a)+a;
  function reset(){p={x:W/2,y:H/2,vx:0,vy:0,hp:3,dash:0,inv:0,ang:0};shots=[];foes=[];sparks=[];score=0;time=0;over=false;spawn=.5;shake=0;}
  function burst(X,Y,n,col){for(let i=0;i<n;i++)sparks.push({x:X,y:Y,vx:rnd(-180,180),vy:rnd(-180,180),life:rnd(.2,.65),col});}
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(over&&e.key==='Enter')reset();});
  addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
  c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;});
  c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
  function update(dt){
    time+=dt; shake=Math.max(0,shake-dt*25); p.ang=Math.atan2(mouse.y-p.y,mouse.x-p.x); p.dash=Math.max(0,p.dash-dt); p.inv=Math.max(0,p.inv-dt);
    let ax=(keys.d?1:0)-(keys.a?1:0), ay=(keys.s?1:0)-(keys.w?1:0), l=Math.hypot(ax,ay)||1;
    const speed=p.dash>0?760:255; p.vx+=(ax/l*speed-p.vx)*Math.min(1,dt*11);p.vy+=(ay/l*speed-p.vy)*Math.min(1,dt*11);
    if(keys[' ']&&p.dash<=0){p.dash=.14;p.inv=.22;keys[' ']=false;burst(p.x,p.y,18,'#8eeaff');}
    p.x=Math.max(18,Math.min(W-18,p.x+p.vx*dt));p.y=Math.max(18,Math.min(H-18,p.y+p.vy*dt));
    if(mouse.down && (!p.fire||time-p.fire>.13)){p.fire=time;shots.push({x:p.x+Math.cos(p.ang)*18,y:p.y+Math.sin(p.ang)*18,vx:Math.cos(p.ang)*720,vy:Math.sin(p.ang)*720,life:1});}
    spawn-=dt;if(spawn<=0){spawn=Math.max(.18,.85-time*.012);let a=rnd(0,Math.PI*2),d=520;foes.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:time>35&&Math.random()<.18?18:12,hp:time>35&&Math.random()<.18?3:1,s:rnd(55,95)+time*1.1});}
    shots.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;});shots=shots.filter(q=>q.life>0&&q.x>-20&&q.x<W+20&&q.y>-20&&q.y<H+20);
    foes.forEach(f=>{let a=Math.atan2(p.y-f.y,p.x-f.x);f.x+=Math.cos(a)*f.s*dt;f.y+=Math.sin(a)*f.s*dt;});
    for(const q of shots)for(const f of foes)if(!f.dead&&Math.hypot(q.x-f.x,q.y-f.y)<f.r+5){q.life=0;f.hp--;burst(q.x,q.y,5,'#ffdf6a');if(f.hp<=0){f.dead=true;score+=10;burst(f.x,f.y,16,'#ff496c');}}
    foes=foes.filter(f=>!f.dead);for(const f of foes)if(Math.hypot(p.x-f.x,p.y-f.y)<f.r+13&&p.inv<=0){p.hp--;p.inv=1;shake=12;burst(p.x,p.y,25,'#ff496c');if(!p.hp)over=true;}
    sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.93;s.vy*=.93;s.life-=dt;});sparks=sparks.filter(s=>s.life>0);
    hud.textContent=`SCORE ${String(score).padStart(4,'0')} · HP ${'♥'.repeat(p.hp)}${'♡'.repeat(3-p.hp)}`;
  }
  function draw(){
    x.fillStyle='#090f1d';x.fillRect(0,0,W,H);x.save();x.translate(rnd(-shake,shake),rnd(-shake,shake));
    x.strokeStyle='#123452';x.lineWidth=1;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke();}for(let i=0;i<H;i+=48){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke();}
    for(const s of sparks){x.globalAlpha=Math.max(0,s.life*2);x.fillStyle=s.col;x.fillRect(s.x-2,s.y-2,4,4);}x.globalAlpha=1;
    x.shadowBlur=14;x.shadowColor='#ff496c';for(const f of foes){x.fillStyle='#ff496c';x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();x.fillStyle='#381027';x.beginPath();x.arc(f.x,f.y,f.r*.45,0,7);x.fill();}x.shadowBlur=0;
    x.fillStyle='#ffef90';for(const q of shots){x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill();}
    if(!over || Math.floor(time*10)%2){x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.shadowBlur=18;x.shadowColor='#49dfff';x.fillStyle=p.inv>0?'#fff':'#49dfff';x.beginPath();x.moveTo(22,0);x.lineTo(-14,13);x.lineTo(-7,0);x.lineTo(-14,-13);x.closePath();x.fill();x.restore();}
    x.restore();
    if(over){x.fillStyle='#060914cc';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#ffdf6a';x.font='bold 58px ui-monospace';x.fillText('SYSTEM DOWN',W/2,H/2-18);x.fillStyle='#c8d9e7';x.font='18px ui-monospace';x.fillText(`Final score: ${score}  ·  Press ENTER to restart`,W/2,H/2+30);}
  }
  function loop(t){let dt=Math.min(.033,(t-last||0)/1000);last=t;if(!over)update(dt);draw();requestAnimationFrame(loop);}reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
